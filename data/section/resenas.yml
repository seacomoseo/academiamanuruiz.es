  - title: C G.
    md: |
      Recomemdables al 100%,por muchas razones, a destacar, no te enseña una figura y fin, te enseña la tecnica de cada movimiento, tanto en salsa como en bachata.

      Recomiendo que si vienes de nivel medio, vayas tambien al nivel inicio, porque aprendes muchísimo en todos los niveles, combinando profesionalidad y diversión.

      Además, este sitio es genial, porque conforme vas avanzando de nivel, puedes bailar mas horas (mas de los que tus pies pueden aguantar jjjj), practicamente todos los dias de la semana y todo por el mismo precio que el inicial.

      El ambiente es inmejorable,y si aun no te has cansado de danzar, despues de clase siempre hay planes em grupo.

      Y por último, ver a Manu bailar es un espectaculo, y ya solo por eso merece la pena ir a sus clases.
    rating: 5
