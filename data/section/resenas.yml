  - title: Natasha A.
    md: |
      Clases IMPRESIONANTES.

      Llegué a Ceuta hace unos meses y no esperaba mucho nivel, viniendo de las clases que he recibido en Francia y en Madrid.

      Manu es el mejor profesor que he tenido en los dos años que llevo bailando.

      Cuida muchísimo la técnica, así como la conexión, adapta las figuras a las lesiones de cada alumno y enseña con muchísima paciencia.

      En muy pocos meses me ha corregido muchísimos errores y me ha dado una confianza en mi forma de bailar que me permite adaptarme a cualquier líder.

      En cuanto a las clases, solo puedo decir que son inmejorables.

      Todo lo que aprendemos se puede utilizar en los sociales y ha conseguido crear una ambiente increíble entre todos sus alumnos.

      Es más, tras las clases siempre nos vamos de cena para disfrutar de más momentos juntos.

      Lo único que puedo decir es que es una gran familia 💕
    rating: 5
    img: https://lh3.googleusercontent.com/a/ACg8ocLYHM5kn5HrdHMtDfT8gqmotgMVDfvl47yapbWBSKCUL0Qf3g=s136
